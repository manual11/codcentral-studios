name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Copy public assets into dist
        run: |
          cp public/404.html dist/
          cp public/.htaccess dist/ 2>/dev/null || true
          cp public/_redirects dist/ 2>/dev/null || true
          cp public/*.jpg dist/ 2>/dev/null || true
          cp public/*.jpeg dist/ 2>/dev/null || true
          cp public/*.webp dist/ 2>/dev/null || true
          cp public/*.mp4 dist/ 2>/dev/null || true

      - name: Update docs/ folder for GitHub Pages
        run: |
          rm -rf docs
          cp -r dist docs

      - name: Commit and push docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "chore: update docs/ build [skip ci]"
          git push
