<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Codcentral Studios</title>
    <script>
      // GitHub Pages SPA routing fix.
      // When GitHub serves this 404.html for any unknown path,
      // we store the intended URL in sessionStorage and redirect to index.html.
      // The script in index.html reads it back and restores the URL before React loads.
      sessionStorage.redirect = location.href;
      var base = location.pathname.split('/').slice(0, 2).join('/');
      location.replace(location.origin + base + '/');
    </script>
  </head>
  <body></body>
</html>
