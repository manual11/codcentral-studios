<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Codcentral Studios</title>
    <script>
      // SPA routing fix for GitHub Pages.
      // Encodes the full path/query/hash into a single query parameter
      // then redirects to the repo root (index.html).
      // The decode script in index.html reads it back before React boots.
      var segmentCount = 1; // number of path segments in the repo name e.g. /codcentral-studios/ = 1
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
